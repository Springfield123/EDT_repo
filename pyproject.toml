[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edt-codebase"
version = "0.2.0"
description = "Paper-companion research codebase for Entanglement-Dynamic Topology workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
quantum = ["qiskit>=1.0"]
nv = ["nvratemodel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
